<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Music Generator MIDI</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}

.subtitle{color:var(--text2);font-size:.9em;margin-bottom:25px;letter-spacing:1px}
.container{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:1200px;width:100%}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;flex:1;min-width:280px;max-width:400px}
.panel h3{color:var(--gold);margin-bottom:15px;font-size:1.1em;text-transform:uppercase;letter-spacing:2px}
.style-buttons{display:flex;flex-direction:column;gap:8px}
.style-btn{background:var(--accent);color:var(--text);border:1px solid var(--border);padding:10px 16px;border-radius:8px;cursor:pointer;font-size:.95em;transition:all .3s;text-align:left}
.style-btn:hover{background:#1a4a7a;border-color:var(--gold)}
.style-btn.active{background:var(--btn);border-color:var(--gold);box-shadow:0 0 15px rgba(233,68,96,.3)}
.style-btn .style-name{font-weight:bold;display:block}
.style-btn .style-desc{font-size:.8em;color:var(--text2)}
.main-btn{background:var(--btn);color:white;border:none;padding:14px 30px;border-radius:10px;font-size:1.1em;cursor:pointer;width:100%;margin-top:15px;font-weight:bold;letter-spacing:1px;transition:all .3s}
.main-btn:hover{background:var(--btn-hover);box-shadow:0 0 25px rgba(233,68,96,.5)}
.main-btn.stop{background:#555}
.main-btn.midi{background:#2ecc71;margin-top:10px}
.main-btn.midi:hover{background:#27ae60}
.slider-group{margin:12px 0}
.slider-group label{display:block;margin-bottom:4px;color:var(--text2);font-size:.85em}
.slider-group input[type=range]{width:100%;accent-color:var(--gold)}
.info-box{background:rgba(0,0,0,.3);border-radius:8px;padding:12px;margin-top:12px;font-size:.8em;color:var(--text2);font-family:monospace;max-height:200px;overflow-y:auto}
.grammar-display{line-height:1.6}
.grammar-display .rule{color:#7ec8e3}
.grammar-display .pattern{color:#f0c060}
.layer-indicator{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.layer-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.layer-dot.drums{background:#e74c3c}
.layer-dot.bass{background:#3498db}
.layer-dot.chords{background:#2ecc71}
.layer-dot.melody{background:#f39c12}
.visualizer{display:flex;gap:3px;align-items:flex-end;height:60px;margin-top:15px}
.vis-bar{flex:1;background:var(--gold);border-radius:2px 2px 0 0;transition:height .1s;min-width:4px}
.midi-info{background:rgba(46,204,113,.1);border:1px solid #2ecc71;border-radius:8px;padding:10px;margin-top:10px;font-size:.8em;color:#2ecc71;display:none}
.midi-info.show{display:block}
</style>
</head>
<body>
<h1>🎵 Grammar-Based Music Generator</h1>
<p class="subtitle">Expert System · Rule-Based · MIDI Export</p>
<div class="container">

<div class="panel"><h3>⚙️ Параметры</h3>
<div class="slider-group"><label>BPM: <span id="bpmValue">120</span></label><input type="range" id="bpm" min="60" max="200" value="120" step="1"></div>
